services:
  - type: web
    name: aurora-api-wzau
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_MODE
        value: require
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: aurora-api-wzau.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://aurora-web-qrql.onrender.com
      - key: AUTH_TOKEN_TTL_HOURS
        value: 12
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini

  - type: web
    name: aurora-web-qrql
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://aurora-api-wzau.onrender.com
    headers:
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://aurora-api-wzau.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
